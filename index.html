<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICA</title>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 25% 25%,
                    rgba(103, 232, 249, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 75% 75%,
                    rgba(110, 231, 183, 0.20),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #f8fafc 0%,
                    #ecfeff 50%,
                    #f0fdf4 100%
                );
        }

        #chemistry-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-cyan,
        .ambient-green {
            position: absolute;
            width: 28rem;
            height: 28rem;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(90px);
            z-index: 0;
        }

        .ambient-cyan {
            top: 15%;
            left: 15%;
            background: rgba(103, 232, 249, 0.16);
        }

        .ambient-green {
            right: 15%;
            bottom: 15%;
            background: rgba(110, 231, 183, 0.14);
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 60vh;
            height: 60vh;
            perspective: 1400px;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition:
                transform 0.85s cubic-bezier(0.2, 0.75, 0.2, 1),
                filter 0.4s ease;
            transform:
                rotateX(2deg)
                rotateY(-4deg);
        }

        .scene:hover .card {
            transform:
                rotateX(4deg)
                rotateY(-7deg)
                translateY(-4px);
        }

        .scene.flipped .card {
            transform:
                rotateX(2deg)
                rotateY(176deg);
        }

        .scene.flipped:hover .card {
            transform:
                rotateX(4deg)
                rotateY(173deg)
                translateY(-4px);
        }

        .face {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border: 1px solid rgba(165, 243, 252, 0.65);
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.76);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 70px rgba(6, 182, 212, 0.12),
                0 12px 35px rgba(16, 185, 129, 0.08),
                inset 0 0 1px rgba(255, 255, 255, 0.95);

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .face img {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            object-fit: contain;
            pointer-events: none;
        }

        .front {
            transform: rotateY(0deg);
        }

        .back {
            transform: rotateY(180deg);
        }

        .shine {
            position: absolute;
            inset: -50%;
            pointer-events: none;

            background:
                linear-gradient(
                    115deg,
                    transparent 35%,
                    rgba(255, 255, 255, 0.22) 48%,
                    transparent 60%
                );

            transform: translateX(-35%) rotate(8deg);
            animation: shine 7s ease-in-out infinite;
        }

        @keyframes shine {
            0%,
            65%,
            100% {
                transform: translateX(-55%) rotate(8deg);
            }

            82% {
                transform: translateX(55%) rotate(8deg);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        .scene {
            animation: float 6s ease-in-out infinite;
        }

        @media (max-width: 700px) {
            .scene {
                width: 60vh;
                height: 60vh;
                max-width: 88vw;
                max-height: 88vw;
            }
        }
    </style>
</head>

<body>

    <canvas id="chemistry-bg"></canvas>

    <div class="ambient-cyan"></div>
    <div class="ambient-green"></div>

    <div class="scene" id="cardScene">
        <div class="card">

            <div class="face front">
                <img
                    src="assets/images/MICA-LOGO&TEXT.png"
                    alt="MICA"
                >
                <div class="shine"></div>
            </div>

            <div class="face back">
                <img
                    src="assets/images/MICA-Logo.png"
                    alt="MICA Logo"
                >
                <div class="shine"></div>
            </div>

        </div>
    </div>

    <script>
        const scene = document.getElementById("cardScene");

        scene.addEventListener("click", () => {
            scene.classList.toggle("flipped");
        });

        document.addEventListener("dragstart", e => {
            e.preventDefault();
        });

        const canvas = document.getElementById("chemistry-bg");
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;

                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;

                this.radius = Math.random() * 2 + 0.8;

                this.color =
                    Math.random() > 0.45
                        ? "2, 132, 199"
                        : "13, 148, 136";

                this.alpha = Math.random() * 0.22 + 0.08;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) {
                    this.vx *= -1;
                }

                if (this.y < 0 || this.y > height) {
                    this.vy *= -1;
                }
            }

            draw() {
                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(${this.color}, ${this.alpha})`;

                ctx.fill();
            }
        }

        function createParticles() {
            particles = [];

            const count = Math.min(
                Math.floor(window.innerWidth / 18),
                55
            );

            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (const particle of particles) {
                particle.update();
                particle.draw();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", resize);

        resize();
        animate();
    </script>

</body>
</html>
