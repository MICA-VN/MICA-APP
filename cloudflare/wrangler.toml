name = "mica-app-api"
main = "index.js"
compatibility_date = "2026-10-17"

[[d1_databases]]
binding = "DB"
database_name = "contents"
database_id = "f4714465-f63b-4696-8c62-86802f9b09e2"
remote = true

[assets]
directory = "../private"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
